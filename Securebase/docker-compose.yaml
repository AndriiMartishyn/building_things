version: '3.7'

services:
  db:
    image: postgres:18.0-alpine
    container_name: securebase_db
    restart: always
    environment:
      TIMEZONE: Europe/Kiev
      POSTGRES_DB: securebase_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data # Persists data even if container is deleted

  rateLimiter:
      image: redis:latest
      container_name: redis
      restart: always
      command: --requirepass test12345 --appendonly yes
      ports:
        - 6379:6379
      volumes:
        - redis_data:/data

volumes:
  pgdata:
  redis_data:
    driver: local

